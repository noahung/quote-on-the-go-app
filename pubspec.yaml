name: qotg_mobile
description: "Quote On The Go - Mobile companion app for iOS and Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  firebase_storage: ^12.4.3
  firebase_messaging: ^15.2.3
  cloud_functions: ^5.3.0
  firebase_app_check: ^0.3.2
  google_sign_in: ^6.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Data Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  lucide_icons_flutter: ^3.1.14+2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0
  pull_to_refresh_flutter3: ^2.0.2
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.10.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Persistence
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  go_router_builder: ^2.8.0

  # App Icon
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
